<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyakuzee - Links</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CSS Variables Configuration (Soft & Angelic Vibe) --- */
        :root {
            --font-main: 'Poppins', sans-serif;
            --font-title: 'Cinzel', serif;
            
            /* Glassmorphism background */
            --glass-bg: rgba(20, 18, 18, 0.6); 
            --glass-border: rgba(255, 235, 205, 0.3); 
            --glass-blur: 15px;
            
            /* Efek hover (Sakura tone / Pink-ish warm) */
            --hover-glow: rgba(255, 183, 197, 0.25); 
            --hover-border: rgba(255, 183, 197, 0.6);
        }

        /* --- 2. Base Resets --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden; 
            font-family: var(--font-main);
            background-color: #0f0c0b; 
        }

        /* --- 3. Background & Canvas Effects --- */
        #bg-image {
            position: fixed; 
            inset: -5%;
            width: 110%;
            height: 110%;
            /* Menggunakan gambar Mahiru yang kamu kirim */
            background-image: url('Mahiru.jpeg'); 
            background-size: cover;
            background-position: center;
            /* Sedikit digelapkan agar teks putih tetap terbaca jelas */
            filter: brightness(0.8) contrast(1.05); 
            transition: transform 0.1s ease-out;
            z-index: 0;
        }

        /* ID Canvas Sakura */
        #sakura-canvas {
            position: fixed; 
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- 4. Component Styles --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.8);
        }

        .font-title {
            font-family: var(--font-title);
        }

        .link-btn {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 25px var(--hover-glow);
            background: var(--hover-glow);
            border-color: var(--hover-border);
        }

        /* --- 5. Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(255, 183, 197, 0.2); }
            50% { box-shadow: 0 0 25px rgba(255, 183, 197, 0.6); }
            100% { box-shadow: 0 0 10px rgba(255, 183, 197, 0.2); }
        }
        .music-playing {
            animation: pulse-glow 2s infinite;
            border-color: rgba(255, 183, 197, 0.6) !important;
        }
        
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .icon-spin {
            animation: spin-slow 4s linear infinite;
        }
    </style>
</head>
<body class="relative flex items-center justify-center min-h-screen text-white py-12">

    <div id="bg-image"></div>
    <canvas id="sakura-canvas"></canvas>

    <audio id="bg-audio" loop preload="auto">
        <source src="shinunoga.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn" class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full glass-card flex items-center justify-center text-white hover:bg-white/10 transition-all cursor-pointer border border-white/20">
        <i id="music-icon" class="fas fa-music text-xl"></i>
    </button>

    <main class="relative z-10 w-full max-w-md px-4 my-auto">
        <div class="glass-card rounded-3xl p-8 flex flex-col items-center animate-fade-in">
            
            <div class="relative w-28 h-28 mb-4 group">
                <div class="absolute inset-0 bg-[#ffb7c5] rounded-full opacity-20 blur-md group-hover:opacity-50 transition-opacity duration-300"></div>
                <img src="webtoon _ season of blossom _ choi jinyoung icon _ pfp.jpeg" alt="Hyakuzee Profile" 
                     class="relative w-full h-full object-cover rounded-full border-2 border-[#ffb7c5]/50 shadow-[0_0_20px_rgba(255,183,197,0.2)]">
            </div>

            <header class="flex flex-col items-center mb-8 w-full">
                <h1 class="text-3xl font-title tracking-widest font-bold text-transparent bg-clip-text bg-gradient-to-r from-white via-[#ffb7c5] to-gray-400">
                    Hyakuzee
                </h1>
                
                <div class="mt-2 flex flex-col items-center gap-1 border-t border-white/10 pt-3 w-3/4">
                    <p class="text-[10px] sm:text-xs text-[#ffb7c5] tracking-[0.2em] uppercase flex items-center gap-2 text-center drop-shadow-md">
                        <span>🌸</span> The Angel Next Door <span>🌸</span>
                    </p>
                    <p class="text-[12px] text-gray-300 tracking-widest text-center font-medium opacity-90 drop-shadow-sm">
                        お隣の天使様
                    </p>
                </div>
            </header>

            <nav id="links-container" class="w-full flex flex-col gap-4" aria-label="Social Links">
                </nav>

        </div>
    </main>

    <script>
        const AppConfig = {
            links: [
                {
                    name: "Instagram",
                    url: "https://www.instagram.com/cyan.kaa/",
                    iconClass: "fab fa-instagram",
                    colorClass: "text-pink-500",
                    hoverColorClass: "group-hover:text-pink-400"
                },
                {
                    name: "Discord Server",
                    url: "https://discord.gg/GShmrUJKMF",
                    iconClass: "fab fa-discord",
                    colorClass: "text-indigo-500",
                    hoverColorClass: "group-hover:text-indigo-400"
                },
                {
                    name: "Spotify",
                    url: "https://open.spotify.com/user/312nrmuwxsw2wt6en2kowrzefqbm?si=1230c37156d44d16",
                    iconClass: "fab fa-spotify",
                    colorClass: "text-green-500",
                    hoverColorClass: "group-hover:text-green-400"
                },
                {
                    name: "YouTube Channel",
                    url: "https://www.youtube.com/@cyan.kaa22",
                    iconClass: "fab fa-youtube",
                    colorClass: "text-red-500",
                    hoverColorClass: "group-hover:text-red-400"
                },
                {
                    name: "Facebook",
                    url: "https://web.facebook.com/hyakuzee.id",
                    iconClass: "fab fa-facebook",
                    colorClass: "text-cyan-500",
                    hoverColorClass: "group-hover:text-cyan-400"
                },
                {
                    name: "X (Twitter)",
                    url: "https://x.com/yfpkuzee",
                    iconClass: "fab fa-twitter",
                    colorClass: "text-dark-cyan-500",
                    hoverColorClass: "group-hover:text-dark-cyan-400"
                }
            ],
            parallax: {
                intensity: 15, 
            },
            // Konfigurasi Bunga Sakura
            sakura: {
                petalCount: 60, // Jumlah kelopak
                colorRGB: '255, 183, 197', // Warna pink sakura
            },
            audio: {
                volume: 0.35 
            }
        };

        class AudioController {
            constructor(audioId, btnId, iconId, config) {
                this.audio = document.getElementById(audioId);
                this.btn = document.getElementById(btnId);
                this.icon = document.getElementById(iconId);
                this.isPlaying = false;
                this.config = config;
                this.init();
            }

            init() {
                if (!this.audio || !this.btn) return;
                this.audio.volume = this.config.volume;
                this.btn.addEventListener('click', () => this.toggleAudio());
            }

            toggleAudio() {
                if (this.isPlaying) {
                    this.audio.pause();
                    this.icon.classList.remove('icon-spin');
                    this.btn.classList.remove('music-playing');
                } else {
                    this.audio.play().catch(error => {
                        console.error("Gagal memutar audio:", error);
                        alert("Pastikan file musik sudah ada di folder yang sama.");
                    });
                    this.icon.classList.add('icon-spin');
                    this.btn.classList.add('music-playing');
                }
                this.isPlaying = !this.isPlaying;
            }
        }

        class LinkRenderer {
            constructor(containerId, linksData) {
                this.container = document.getElementById(containerId);
                this.linksData = linksData;
                this.render();
            }

            render() {
                if (!this.container) return;
                const linksHTML = this.linksData.map(link => {
                    return `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" 
                           class="link-btn flex items-center p-4 rounded-xl border border-white/10 bg-white/5 relative overflow-hidden group">
                            <i class="${link.iconClass} text-2xl w-8 ${link.colorClass} ${link.hoverColorClass} transition-colors"></i>
                            <span class="font-semibold tracking-wide ml-2">${link.name}</span>
                        </a>
                    `;
                }).join('');
                this.container.innerHTML = linksHTML;
            }
        }

        class ParallaxEffect {
            constructor(elementId, config) {
                this.element = document.getElementById(elementId);
                this.config = config;
                this.init();
            }

            init() {
                if (!this.element) return;
                document.addEventListener('mousemove', this.handleMouseMove.bind(this));
            }

            handleMouseMove(event) {
                const x = (event.clientX / window.innerWidth - 0.5) * this.config.intensity;
                const y = (event.clientY / window.innerHeight - 0.5) * this.config.intensity;
                this.element.style.transform = `translate(${-x}px, ${-y}px) scale(1.05)`;
            }
        }

        class SakuraPetal {
            constructor(canvasWidth, canvasHeight, config) {
                this.canvasWidth = canvasWidth;
                this.canvasHeight = canvasHeight;
                this.config = config;
                this.reset(true);
            }

            reset(isInitial = false) {
                this.x = Math.random() * this.canvasWidth;
                this.y = isInitial ? Math.random() * this.canvasHeight : -30;
                
                this.size = Math.random() * 4 + 3;
                this.speed = Math.random() * 1.5 + 0.5;
                this.sway = Math.random() * 1.5 + 0.5; 
                
                this.angle = Math.random() * Math.PI * 2;
                this.angleSpeed = Math.random() * 0.02 + 0.01;
                
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            update(canvasWidth, canvasHeight) {
                this.canvasWidth = canvasWidth;
                this.canvasHeight = canvasHeight;
                
                this.y += this.speed;
                this.angle += this.angleSpeed;
                this.x += Math.sin(this.angle) * this.sway + 0.5; 
                this.rotation += this.rotationSpeed;
                
                if (this.y > this.canvasHeight + 20 || this.x > this.canvasWidth + 20 || this.x < -20) {
                    this.reset();
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(this.size, -this.size, this.size * 1.5, 0);
                ctx.quadraticCurveTo(this.size, this.size, 0, 0);
                
                ctx.fillStyle = `rgba(${this.config.colorRGB}, ${this.opacity})`;
                ctx.fill();
                ctx.restore();
            }
        }

        class SakuraSimulator {
            constructor(canvasId, config) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.config = config;
                this.petals = [];
                this.init();
            }

            init() {
                if (!this.canvas) return;
                this.handleResize();
                window.addEventListener('resize', this.handleResize.bind(this));
                this.createPetals();
                this.animate();
            }

            handleResize() {
                this.width = this.canvas.width = window.innerWidth;
                this.height = this.canvas.height = window.innerHeight;
            }

            createPetals() {
                for (let i = 0; i < this.config.petalCount; i++) {
                    this.petals.push(new SakuraPetal(this.width, this.height, this.config));
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                this.petals.forEach(petal => {
                    petal.update(this.width, this.height);
                    petal.draw(this.ctx);
                });
                requestAnimationFrame(this.animate.bind(this));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new LinkRenderer('links-container', AppConfig.links);
            new ParallaxEffect('bg-image', AppConfig.parallax);
            new SakuraSimulator('sakura-canvas', AppConfig.sakura);
            new AudioController('bg-audio', 'music-btn', 'music-icon', AppConfig.audio);
        });
    </script>
</body>
</html>
